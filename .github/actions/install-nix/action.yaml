---
# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: Install Nix
description: Install pinned Nix from its release tarball as a multi-user install

runs:
  using: composite
  steps:
    - name: Install Nix
      shell: bash
      env:
        NIX_VERSION: 2.36.0
        NIX_SYSTEM: x86_64-linux
        NIX_TARBALL_SHA256: c4d1aed088f62aa729823cffa3269e880de6ce6102fecb8909f2821eedb2f2eb
      run: |
        tarball="$RUNNER_TEMP/nix.tar.xz"
        url="https://releases.nixos.org/nix/nix-$NIX_VERSION/nix-$NIX_VERSION-$NIX_SYSTEM.tar.xz"
        installer_dir="$RUNNER_TEMP/nix-$NIX_VERSION-$NIX_SYSTEM"

        curl --fail --silent --show-error --location \
          --retry 3 --retry-all-errors \
          --output "$tarball" "$url"

        echo "$NIX_TARBALL_SHA256  $tarball" | sha256sum --check -

        tar --extract --file "$tarball" --directory "$RUNNER_TEMP"
        cd "$installer_dir"
        ./install --daemon --yes --no-channel-add

        echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
